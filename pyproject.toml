[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qoffee"
version = "0.3.0"
description = "Quantum job tracking and notification for IBM Quantum."
requires-python = ">=3.11"
dependencies = [
    # Pinned to a minor range: RuntimeJob, result streaming and the callback
    # parameter were all removed in recent releases, so an unpinned upgrade
    # can change behaviour under us.
    "qiskit-ibm-runtime>=0.49,<0.50",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
qoffee = "qoffee.cli:main"

[tool.setuptools.packages.find]
include = ["qoffee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real IBM API; requires credentials, excluded by default",
]
