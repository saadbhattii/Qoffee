name: Qoffee Watcher

on:
  schedule:
    # GitHub delays scheduled runs under load; 15 minutes is a floor, not a
    # promise. Fine for queues measured in hours.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and decide, but send nothing and change no tags"
        type: boolean
        default: false
      verbose:
        description: "Debug logging"
        type: boolean
        default: false

# Cron, manual dispatch and a re-run can overlap. Without this, two runs both
# notify and both rewrite tags — duplicate messages at best, a lost tag at
# worst, since update_tags overwrites rather than appends.
concurrency:
  group: qoffee-watcher
  cancel-in-progress: false

permissions:
  contents: write   # keepalive pushes an empty commit; read is not enough

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the keepalive step can read the last commit date.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Watch
        env:
          IBM_TOKEN: ${{ secrets.IBM_TOKEN }}
          IBM_CRN: ${{ secrets.IBM_CRN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          python -m qoffee \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.verbose && '--verbose' || '' }}

      # GitHub disables scheduled workflows in public repos after 60 days with
      # no commit activity — silently, and that kills manual dispatch too. An
      # empty commit every 45 days resets the clock. Done inline rather than
      # via a third-party action, which is what the repository-access block
      # was about.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          if [ "$AGE" -ge 45 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (${AGE}d since last commit)"
            git push
            echo "Keepalive commit pushed."
          else
            echo "Last commit ${AGE}d ago; no keepalive needed."
          fi