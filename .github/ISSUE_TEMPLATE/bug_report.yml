name: Bug Report
description: Report a reproducible problem in Qoffee
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove tokens, webhook URLs, job IDs, instance CRNs, and unredacted logs before submitting.
  - type: input
    id: version
    attributes:
      label: Qoffee version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, OS, and GitHub Actions runner if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command or workflow trigger and a minimal configuration description.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted output and the exit code, if applicable.
    validations:
      required: true
